name: ocra review
description: Multi-agent code review for pull requests with Open-CR-Agent (ocra).
author: jma49
branding:
  icon: search
  color: blue

inputs:
  github-token:
    description: Token used to read the pull request and post the review.
    default: ${{ github.token }}
  args:
    description: Extra arguments for ocra review, such as --reviewers correctness,security, for ocra learn with learn, or for ocra reply with reply.
    default: ""
  fail-on-concerns:
    description: >-
      Fail the job when the verdict is significant_concerns (a critical finding
      the verifier confirmed). Off by default: the verdict comes from models
      that read the change and is advice, not a security gate.
    default: "false"
  opencode:
    description: >-
      Install OpenCode, the default runtime (about 140 MB). Set to false when
      the configuration sets "runtime": "direct": the install then leaves it
      out, and a review that needs it stops with exit code 2.
    default: "true"
  symbol-cache:
    description: >-
      Keep the symbols ocra parses (definitions and uses per file, keyed by
      the file's content) in the Actions cache between runs, so a review
      parses only files no earlier run read. Entries no run read for 30 days
      are dropped.
    default: "true"
  learn:
    description: >-
      Draft learnings instead of reviewing, and open them as a pull request:
      mine drafts from the fix commits (on a schedule; check out with
      fetch-depth 0), remember from the @ocra remember notes of the pull
      request a comment is on (on issue_comment). One opened with the
      workflow's own token starts no checks, so it is left for a person to
      merge; pass a GitHub App's token as github-token to merge it once its
      checks pass.
    default: ""
  reply:
    description: >-
      Answer the comment that started the workflow (issue_comment or
      pull_request_review_comment) when it mentions @ocra, in its thread,
      instead of reviewing. ocra answers only people with write access and
      each comment once.
    default: "false"
  sarif:
    description: >-
      Also write the review as SARIF 2.1.0 (for code scanning) to the file
      the sarif output names. Takes the place of --format and --output in
      args.
    default: "false"

outputs:
  verdict:
    description: >-
      Empty unless the review completed (exit code 0 or 1). The review's verdict: approved, approved_with_comments, minor_issues or
      significant_concerns. Empty when ocra wrote no report.
    value: ${{ steps.review.outputs.verdict }}
  exit-code:
    description: >-
      ocra's exit code (0; 1 significant concerns; 2 error; 3 incomplete
      review), before fail-on-concerns turns 1 into a passing step.
    value: ${{ steps.review.outputs.exit-code }}
  run-id:
    description: The run id, also in the summary comment and the SARIF log.
    value: ${{ steps.review.outputs.run-id }}
  report:
    description: Path to the JSON report (the shape of ocra review --format json).
    value: ${{ steps.review.outputs.report }}
  sarif:
    description: Path to the SARIF log, when the sarif input is true.
    value: ${{ steps.review.outputs.sarif }}
  findings:
    description: The number of findings in the report.
    value: ${{ steps.review.outputs.findings }}
  proposal:
    description: >-
      With learn: the address of the pull request opened, empty when no
      learning was kept.
    value: ${{ steps.learn.outputs.proposal }}

runs:
  using: composite
  steps:
    # Pinned by commit: a moved tag would run someone else's code with the
    # model key in the environment.
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
      with:
        node-version: 22
        # setup-node caches ~/.npm on its own when the caller's package.json
        # names npm as its package manager: a cache entry in the caller's
        # repository that the install below would never read anyway.
        package-manager-cache: false

    # The published @open-cr-agent/cli of this action's version, with every
    # dependency at the version this ref's package-lock.json pins, install
    # scripts off and registry signatures verified; this ref built from
    # source while its version is not on npm yet.
    - name: Install ocra
      id: install
      shell: bash
      env:
        OCRA_INSTALL_OPENCODE: ${{ inputs.opencode }}
      run: node "$GITHUB_ACTION_PATH/scripts/action-install.mjs"

    # Each run restores the newest earlier entry and saves its own (cache
    # keys are immutable). An entry holds only names and line numbers and is
    # validated on read, so the most a forged one can do is mislead the
    # callers list; it never runs.
    - name: Restore the symbol cache
      if: inputs.symbol-cache == 'true' && inputs.learn == '' && inputs.reply != 'true'
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ runner.temp }}/ocra-cache/symbols
        key: ocra-symbols-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
        restore-keys: ocra-symbols-${{ runner.os }}-

    # Inputs reach the script only through environment variables, never
    # interpolated into it, so pull request text cannot inject shell code.
    # exec: the runner signals this step's shell when the run is cancelled,
    # and a shell waiting on another would not pass the signal on.
    - name: Review
      id: review
      if: inputs.learn == '' && inputs.reply != 'true'
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.github-token }}
        # On a comment (@ocra review), the pull request it is on, reviewed
        # in full.
        OCRA_PR: ${{ github.event.pull_request.number || (github.event.issue.pull_request && github.event.issue.number) || '' }}
        OCRA_FULL: ${{ github.event_name == 'issue_comment' }}
        OCRA_ARGS: ${{ inputs.args }}
        OCRA_FAIL_ON_CONCERNS: ${{ inputs.fail-on-concerns }}
        OCRA_SARIF: ${{ inputs.sarif }}
        OCRA_MAIN: ${{ steps.install.outputs.main }}
        OCRA_CACHE_DIR: ${{ runner.temp }}/ocra-cache
      run: exec bash "$GITHUB_ACTION_PATH/scripts/action-review.sh"

    # The comment's text never reaches the step; ocra reads the notes
    # through the API, only those of people with write access.
    - name: Learn
      id: learn
      if: inputs.learn != '' && inputs.reply != 'true'
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.github-token }}
        OCRA_LEARN: ${{ inputs.learn }}
        OCRA_PR: ${{ github.event.pull_request.number || (github.event.issue.pull_request && github.event.issue.number) || '' }}
        OCRA_OWN_TOKEN: ${{ inputs.github-token == github.token }}
        OCRA_ARGS: ${{ inputs.args }}
        OCRA_MAIN: ${{ steps.install.outputs.main }}
      run: exec bash "$GITHUB_ACTION_PATH/scripts/action-learn.sh"

    # As with Learn, the comment's text never reaches the step: ocra reads
    # it through the API.
    - name: Reply
      if: inputs.reply == 'true'
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.github-token }}
        OCRA_PR: ${{ github.event.pull_request.number || (github.event.issue.pull_request && github.event.issue.number) || '' }}
        OCRA_COMMENT: ${{ github.event.comment.id }}
        OCRA_INLINE: ${{ github.event_name == 'pull_request_review_comment' }}
        OCRA_ARGS: ${{ inputs.args }}
        OCRA_MAIN: ${{ steps.install.outputs.main }}
      run: exec bash "$GITHUB_ACTION_PATH/scripts/action-reply.sh"

    # Before the cache saves (a post step): a read touches its entry.
    - name: Drop symbols no run read for 30 days
      if: inputs.symbol-cache == 'true' && inputs.learn == '' && inputs.reply != 'true'
      shell: bash
      run: |
        dir="$RUNNER_TEMP/ocra-cache/symbols"
        if [ -d "$dir" ]; then find "$dir" -type f -mtime +30 -delete; fi
