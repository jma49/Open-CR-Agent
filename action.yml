name: ocra review
description: Multi-agent code review for pull requests with Open-CR-Agent (ocra).
author: jma49
branding:
  icon: search
  color: blue

inputs:
  github-token:
    description: Token used to read the pull request and post the review.
    default: ${{ github.token }}
  args:
    description: Extra arguments for ocra review, such as --reviewers correctness,security.
    default: ""
  fail-on-concerns:
    description: >-
      Fail the job when the verdict is significant_concerns (a critical finding
      the verifier confirmed). Off by default: the verdict comes from models
      that read the change and is advice, not a security gate.
    default: "false"
  sarif:
    description: >-
      Also write the review as SARIF 2.1.0 (for code scanning) to the file
      the sarif output names. Takes the place of --format and --output in
      args.
    default: "false"

outputs:
  verdict:
    description: >-
      The review's verdict: approved, approved_with_comments, minor_issues or
      significant_concerns. Empty when ocra wrote no report.
    value: ${{ steps.review.outputs.verdict }}
  exit-code:
    description: >-
      ocra's exit code (0; 1 significant concerns; 2 error; 3 incomplete
      review), before fail-on-concerns turns 1 into a passing step.
    value: ${{ steps.review.outputs.exit-code }}
  run-id:
    description: The run id, also in the summary comment and the SARIF log.
    value: ${{ steps.review.outputs.run-id }}
  report:
    description: Path to the JSON report (the shape of ocra review --format json).
    value: ${{ steps.review.outputs.report }}
  sarif:
    description: Path to the SARIF log, when the sarif input is true.
    value: ${{ steps.review.outputs.sarif }}
  findings:
    description: The number of findings in the report.
    value: ${{ steps.review.outputs.findings }}

runs:
  using: composite
  steps:
    # Pinned by commit: a moved tag would run someone else's code with the
    # model key in the environment.
    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
      with:
        node-version: 22
        # setup-node caches ~/.npm on its own when the caller's package.json
        # names npm as its package manager: a cache entry in the caller's
        # repository that the install below would never read anyway.
        package-manager-cache: false

    # The published @open-cr-agent/cli of this action's version, with every
    # dependency at the version this ref's package-lock.json pins, install
    # scripts off and registry signatures verified; this ref built from
    # source while its version is not on npm yet.
    - name: Install ocra
      id: install
      shell: bash
      run: node "$GITHUB_ACTION_PATH/scripts/action-install.mjs"

    # Inputs reach the script only through environment variables, never
    # interpolated into it, so pull request text cannot inject shell code.
    - name: Review
      id: review
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.github-token }}
        OCRA_PR: ${{ github.event.pull_request.number }}
        OCRA_ARGS: ${{ inputs.args }}
        OCRA_FAIL_ON_CONCERNS: ${{ inputs.fail-on-concerns }}
        OCRA_SARIF: ${{ inputs.sarif }}
        OCRA_MAIN: ${{ steps.install.outputs.main }}
      run: |
        if [ -z "$OCRA_PR" ]; then
          echo "::error::ocra review runs on pull_request events"
          exit 2
        fi
        # Split on whitespace, across lines, without glob expansion against
        # the checkout.
        read -r -d '' -a extra <<< "$OCRA_ARGS" || true
        mkdir -p "$RUNNER_TEMP/ocra"
        export OCRA_SARIF_FILE="$RUNNER_TEMP/ocra/ocra.sarif"
        rm -f "$OCRA_SARIF_FILE"
        # Last, so they win over a --format or --output in args.
        if [ "$OCRA_SARIF" = "true" ]; then extra+=(--format sarif --output "$OCRA_SARIF_FILE"); fi
        # Run ids start with the UTC second the run started: the outputs
        # come from the session report of this run, not an earlier one.
        export OCRA_STARTED="$(date -u +%Y%m%dT%H%M%SZ)"
        # Bash does not pass a cancellation's SIGINT/SIGTERM on to a child it
        # waits for, so ocra runs in the background and gets them forwarded:
        # it then stops, writes its partial report and publishes nothing.
        node "$OCRA_MAIN" review --pr "$OCRA_PR" --publish "${extra[@]}" &
        pid=$!
        trap 'kill -INT "$pid" 2>/dev/null' INT TERM
        code=0
        while kill -0 "$pid" 2>/dev/null; do
          wait "$pid" && code=0 || code=$?
        done
        OCRA_EXIT_CODE="$code" node "$GITHUB_ACTION_PATH/scripts/action-outputs.mjs"
        if [ "$code" -eq 1 ] && [ "$OCRA_FAIL_ON_CONCERNS" != "true" ]; then code=0; fi
        exit "$code"
