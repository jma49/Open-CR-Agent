name: Release

# Publishes the packages to npm when a GitHub release is published, through
# npm trusted publishing: no npm token is stored anywhere, and npm attaches
# provenance. Versions the registry already has are skipped, so re-running a
# failed run resumes it, and the release of a version published by hand (the
# first one, see docs/releasing.md) passes.
# A dry run by hand: gh workflow run release.yml --ref main

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      dry-run:
        description: Check, build and pack, and publish nothing
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # Installs the dependencies without install scripts, runs the tests and
  # packs the tarballs, without the right to publish.
  pack:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    # The tarballs' digests: publish checks what it downloads against them,
    # since a later job of this run could replace the artifact, not these.
    outputs:
      digests: ${{ steps.pack.outputs.digests }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The release commit must be on main; the script checks.
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false
      # An install script could change what gets packed; building and
      # testing need none.
      - run: npm ci --ignore-scripts
      - id: pack
        run: node scripts/release.mjs pack packed
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: packages
          path: packed/
          if-no-files-found: error
          retention-days: 7

  # Installs the packed tarballs as a user would and runs the installed ocra.
  # Third-party install scripts run here, so it runs after the tarballs are
  # uploaded, and neither packs nor publishes anything.
  check:
    needs: pack
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # The oldest Node.js line the packages support.
          node-version: 22
          package-manager-cache: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: packages
          path: packed
      - run: node scripts/check-packages.mjs --tarballs packed

  # Can mint a publish token, so it installs nothing and runs no code but npm
  # and scripts/release.mjs, which has no dependencies.
  publish:
    needs: [pack, check]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # Trusted publishing needs npm 11.5.1 or newer, which Node 24 ships.
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: packages
          path: packed
      - name: Publish
        if: github.event_name == 'release' || !inputs.dry-run
        env:
          PACKED_DIGESTS: ${{ needs.pack.outputs.digests }}
        run: node scripts/release.mjs upload packed --publish
      - name: Dry run
        if: github.event_name == 'workflow_dispatch' && inputs.dry-run
        env:
          PACKED_DIGESTS: ${{ needs.pack.outputs.digests }}
        run: node scripts/release.mjs upload packed

  # The container image of the release, from the packages just published
  # (never from source: the Dockerfile refuses), for amd64 and arm64, with
  # build provenance. The first push creates ghcr.io/jma49/ocra as a private
  # package; make it public once in the package settings.
  image:
    needs: publish
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: meta
        run: |
          version=$(node -p 'require("./packages/cli/package.json").version')
          tags="ghcr.io/jma49/ocra:$version"
          case "$version" in *-*) ;; *) tags="$tags,ghcr.io/jma49/ocra:latest" ;; esac
          echo "tags=$tags" >> "$GITHUB_OUTPUT"
          # The registry can take a minute to serve a version it just accepted.
          for _ in $(seq 1 30); do
            npm view "@open-cr-agent/cli@$version" version >/dev/null 2>&1 && exit 0
            sleep 10
          done
          echo "::error::@open-cr-agent/cli@$version is not on npm"
          exit 1
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          build-args: OCRA_INSTALL=npm
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          provenance: mode=max
          sbom: true
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/jma49/ocra
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

