# Dogfooding: ocra reviews pull requests in the maintainer's repositories on
# Vertex AI, within a hard budget. Each repository calls this file at main
# from its own ocra-review.yml. Google Cloud issues the keyless credential only
# to this file at refs/heads/main (the token's job_workflow_ref), only for
# pull_request events of the maintainer's repositories. A pull request can
# edit its own copy of this file or of the caller, but a copy at its own ref
# gets no credential, and the caller passes nothing that moves the budget: the
# switch and the budget are repository variables, read here.
#
# With model-source "openrouter" a caller reviews on OpenRouter's free model
# instead, through the direct runtime and the caller's OPENROUTER_API_KEY: no
# Google credential, no dollar ledger (the model costs $0), and a task cap in
# place of the budget, since the limit there is the account's 1000 free
# requests a UTC day. The configuration is written here, outside the
# checkout, and passed with --config: nothing in it comes from the pull
# request.
name: ocra dogfood

on:
  workflow_call:
    inputs:
      model-source:
        description: Where the models come from, vertex (default) or openrouter.
        type: string
        default: vertex
    secrets:
      # Secrets rather than variables: the job log of a public repository
      # would show a variable's value, and these name the Vertex project.
      # Required with model-source vertex.
      GCP_WIF_PROVIDER:
        description: Full resource name of the Workload Identity provider.
        required: false
      GCP_SERVICE_ACCOUNT:
        description: Email of the service account that may call Vertex AI models.
        required: false
      GOOGLE_VERTEX_PROJECT:
        description: Google Cloud project that serves Vertex AI.
        required: false
      OPENROUTER_API_KEY:
        description: OpenRouter key, required with model-source openrouter.
        required: false

permissions: {}

jobs:
  # One review at a time per repository, so each one's guard sees every
  # earlier cost: a later run waits, and GitHub keeps only the newest waiting
  # run of the group.
  #
  # The ledger is artifacts named ocra-cost-<run>-<attempt>-<kind><cents>:
  # r, the reservation uploaded before a review may spend anything, and c,
  # what the review spent, uploaded after it. A review with no c entry counts
  # at its reservation, so a job that dies before recording still counts.
  # Listing names needs only actions: read, and a failed listing fails the job
  # before anything is spent.
  review:
    if: >-
      vars.OCRA_REVIEW == 'on' &&
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: ocra-dogfood-${{ github.repository }}
      cancel-in-progress: false
    permissions:
      actions: read
      contents: read
      id-token: write
      pull-requests: write
    env:
      # One review's spend limit (ocra's --max-cost-usd), and the dollars a
      # UTC day may start reviews with.
      CAP_USD: "2"
      DAILY_USD: "2"
      SOURCE: ${{ inputs.model-source }}
      # The free model, in this one place; swap it when the preview ends.
      FREE_MODEL: stealth/space-bunny-alpha
      # Review tasks one review may start on the free model: a task takes 30
      # to 70 requests, so a review stays within a few hundred of the day's
      # 1000. Files past the cap are reported as not reviewed.
      FREE_MAX_TASKS: "8"
      # Requests the day must have left before a review starts.
      FREE_MIN_REQUESTS: "40"
    steps:
      - id: guard
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          SWITCH: ${{ vars.OCRA_REVIEW }}
          BUDGET_USD: ${{ vars.OCRA_REVIEW_BUDGET_USD }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          set -euo pipefail
          case "$SOURCE" in
            vertex) ;;
            openrouter)
              allowed=true
              if [ "$SWITCH" != on ]; then
                allowed=false
                reason="reviews are off (OCRA_REVIEW is '$SWITCH')"
              elif [ -z "$OPENROUTER_API_KEY" ]; then
                echo "::error::model-source openrouter needs the OPENROUTER_API_KEY secret"
                exit 1
              else
                # GET /key is not a model request: it reports the free
                # requests left today without spending one. When it does not
                # say, the review runs and a spent quota shows in its report.
                left=$(curl -fsS --max-time 20 -H "Authorization: Bearer $OPENROUTER_API_KEY" \
                  https://openrouter.ai/api/v1/key | jq -r '.data.free_model_daily_requests.remaining // empty' || true)
                if [[ "$left" =~ ^[0-9]+$ ]] && [ "$left" -lt "$FREE_MIN_REQUESTS" ]; then
                  allowed=false
                  reason="the free model quota is spent ($left request(s) left) until 00:00 UTC"
                fi
              fi
              echo "allowed=$allowed" >> "$GITHUB_OUTPUT"
              {
                echo "### ocra dogfood on the free model"
                echo
                echo "Model router/$FREE_MODEL, at most $FREE_MAX_TASKS review tasks; free requests left today: ${left:-not reported}."
                echo
                if [ "$allowed" = true ]; then echo "Review allowed."; else echo "**No review:** $reason."; fi
              } >> "$GITHUB_STEP_SUMMARY"
              if [ "$allowed" != true ]; then echo "::notice title=No ocra review::$reason"; fi
              exit 0
              ;;
            *)
              echo "::error::model-source must be vertex or openrouter, got '$SOURCE'"
              exit 1
              ;;
          esac
          cents() {
            if ! [[ "$1" =~ ^[0-9]+(\.[0-9]{1,2})?$ ]]; then
              echo "::error::not a dollar amount: '$1'"
              exit 1
            fi
            awk -v d="$1" 'BEGIN { printf "%d", d * 100 + 0.5 }'
          }
          usd() { awk -v c="$1" 'BEGIN { printf "$%.2f", c / 100 }'; }
          budget=$(cents "$BUDGET_USD")
          daily=$(cents "$DAILY_USD")
          cap=$(cents "$CAP_USD")
          # ocra stops running review tasks at its limit, but what they spend
          # between two reports and their steps in progress can still pass
          # it. Half the cap again covers that with room to spare.
          reserve=$((cap * 3 / 2))

          listing=$(gh api --paginate "repos/$REPOSITORY/actions/artifacts?per_page=100" \
            --jq '.artifacts[] | select(.name | startswith("ocra-cost-")) | "\(.created_at[0:10]) \(.name)"')
          today=$(date -u +%F)
          # A name the steps below did not write counts as a full reservation.
          read -r spent spent_today runs < <(printf '%s\n' "$listing" |
            awk -v today="$today" -v reserve="$reserve" '
              NF < 2 { next }
              $2 ~ /^ocra-cost-[0-9]+-[0-9]+-[cr][0-9]+$/ {
                split($2, part, "-")
                key = part[3] "-" part[4]
                if (substr(part[5], 1, 1) == "c") { done[key] = substr(part[5], 2) + 0; doneDay[key] = $1 }
                else { held[key] = substr(part[5], 2) + 0; heldDay[key] = $1 }
                next
              }
              { spent += reserve; runs++; if ($1 == today) spentToday += reserve }
              END {
                for (key in done) { spent += done[key]; runs++; if (doneDay[key] == today) spentToday += done[key] }
                for (key in held) if (!(key in done)) { spent += held[key]; runs++; if (heldDay[key] == today) spentToday += held[key] }
                printf "%d %d %d\n", spent, spentToday, runs
              }')

          allowed=true
          if [ "$SWITCH" != on ]; then
            allowed=false
            reason="reviews are off (OCRA_REVIEW is '$SWITCH')"
          elif [ $((spent + reserve)) -gt "$budget" ]; then
            allowed=false
            reason="the budget of $(usd "$budget") is spent: $(usd "$spent") over $runs review(s), and one more may cost $(usd "$reserve")"
          elif [ "$spent_today" -ge "$daily" ]; then
            allowed=false
            reason="today's $(usd "$daily") is spent ($(usd "$spent_today")); reviews start again tomorrow (UTC)"
          fi
          echo "allowed=$allowed" >> "$GITHUB_OUTPUT"
          echo "reserve=$reserve" >> "$GITHUB_OUTPUT"
          {
            echo "### ocra dogfood budget"
            echo
            echo "Spent $(usd "$spent") of $(usd "$budget") over $runs review(s), $(usd "$spent_today") of today's $(usd "$daily")."
            echo
            if [ "$allowed" = true ]; then
              echo "Review allowed, capped at $(usd "$cap")."
            else
              echo "**No review:** $reason."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          # The summary is not in the log; a skipped review says why there too,
          # so a green check that posted nothing explains itself.
          if [ "$allowed" != true ]; then echo "::notice title=No ocra review::$reason"; fi

      # The reservation goes into the ledger before anything can be spent; if
      # it cannot be recorded, the job stops here.
      - id: reserve
        if: steps.guard.outputs.allowed == 'true' && steps.guard.outputs.reserve != ''
        shell: bash
        env:
          RESERVE_CENTS: ${{ steps.guard.outputs.reserve }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          jq -n --argjson cents "$RESERVE_CENTS" '{reservedUsd: ($cents / 100)}' > "$RUNNER_TEMP/ocra-reserve.json"
          echo "name=ocra-cost-$RUN_ID-$RUN_ATTEMPT-r$RESERVE_CENTS" >> "$GITHUB_OUTPUT"

      - if: steps.reserve.outputs.name != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.reserve.outputs.name }}
          path: ${{ runner.temp }}/ocra-reserve.json
          # The Vertex trial ends on 2026-12-27; the ledger must outlive it.
          retention-days: 90
          if-no-files-found: error

      # Before auth: its credentials file goes into the workspace checkout
      # creates. ocra reviews a pull request from git objects, so agents never
      # see that untracked file, and its name is a secret path besides.
      - if: steps.guard.outputs.allowed == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - if: steps.guard.outputs.allowed == 'true' && env.SOURCE == 'vertex'
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      # Only a report written after this mark is this run's: a pull request
      # can commit files under .ocra/sessions, but not newer ones.
      - if: steps.guard.outputs.allowed == 'true'
        shell: bash
        run: touch "$RUNNER_TEMP/ocra-review-start"

      # Advice only: a failed or incomplete review never fails the pull request.
      - id: review
        if: steps.guard.outputs.allowed == 'true' && env.SOURCE == 'vertex'
        uses: jma49/Open-CR-Agent@324c6abae8a145e71392511f3a731db3c6e29fbb # v0.3.0
        continue-on-error: true
        env:
          GOOGLE_VERTEX_PROJECT: ${{ secrets.GOOGLE_VERTEX_PROJECT }}
          GOOGLE_VERTEX_LOCATION: global
          OCRA_MODEL_TOP: google-vertex/gemini-3.1-pro-preview
          OCRA_MODEL_STANDARD: google-vertex/gemini-3.5-flash,google-vertex/gemini-3.5-flash-lite
          OCRA_MODEL_LIGHT: google-vertex/gemini-3.5-flash-lite
        with:
          args: --max-cost-usd ${{ env.CAP_USD }}

      # Written by this file at main, outside the checkout, and passed with
      # --config, which replaces the base commit's .ocra/config.json: the
      # runtime, the endpoint and the key's variable name never come from the
      # pull request. No OCRA_MODEL_* variable is set, since those would win
      # over the file's models.
      - name: Write the free model configuration
        if: steps.guard.outputs.allowed == 'true' && env.SOURCE == 'openrouter'
        shell: bash
        run: |
          set -euo pipefail
          jq -n --arg model "$FREE_MODEL" --argjson maxTasks "$FREE_MAX_TASKS" '{
            runtime: "direct",
            maxTasks: $maxTasks,
            models: { top: ["router/\($model)"], standard: ["router/\($model)"], light: ["router/\($model)"] },
            providers: {
              router: {
                type: "openai-compatible",
                baseUrl: "https://openrouter.ai/api/v1",
                apiKeyEnv: "OPENROUTER_API_KEY",
                models: { ($model): { input: 0, output: 0 } }
              }
            }
          }' > "$RUNNER_TEMP/ocra-free.json"

      # Advice only, as above.
      - id: review-free
        if: steps.guard.outputs.allowed == 'true' && env.SOURCE == 'openrouter'
        uses: jma49/Open-CR-Agent@324c6abae8a145e71392511f3a731db3c6e29fbb # v0.3.0
        continue-on-error: true
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        with:
          opencode: false
          args: --config ${{ runner.temp }}/ocra-free.json

      # A day whose free requests ran out fails every task with HTTP 429 and
      # ocra exits 2 (or 3, when some tasks finished first). That is a
      # skipped review, not a broken one: say so instead of leaving a failed
      # step to read. ocra has already posted the review as incomplete.
      - id: free-outcome
        name: Read the free model outcome
        if: always() && steps.review-free.outcome != '' && steps.review-free.outcome != 'skipped'
        shell: bash
        env:
          EXIT_CODE: ${{ steps.review-free.outputs.exit-code }}
          REPORT: ${{ steps.review-free.outputs.report }}
        run: |
          set -euo pipefail
          quota='429|quota|rate.?limit|free-models-per-day'
          failed=0 spent=0 total=0
          if [ -n "$REPORT" ] && [ -f "$REPORT" ]; then
            read -r total failed spent < <(jq -r --arg re "$quota" '
              [.tasks[]?] as $t
              | [$t[] | select(.status != "completed")] as $f
              | "\($t | length) \($f | length) \([$f[] | select((.error // "") | test($re; "i"))] | length)"' "$REPORT")
          fi
          {
            echo
            echo "ocra exited ${EXIT_CODE:-without an exit code}: $total task(s), $failed not completed, $spent of them on the free quota."
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$spent" -gt 0 ] && [ "$spent" -eq "$total" ]; then
            echo "::notice title=No ocra review::the free model quota is spent until 00:00 UTC; every review task failed on it"
          elif [ "$spent" -gt 0 ]; then
            echo "::notice title=Incomplete ocra review::the free model quota ran out during the review ($spent of $total tasks); it resets at 00:00 UTC"
          elif [ "${EXIT_CODE:-2}" != 0 ] && [ "${EXIT_CODE:-2}" != 1 ]; then
            echo "::warning title=ocra review::ocra exited ${EXIT_CODE:-without an exit code}; see the review step's log"
          fi

      # Runs after a failure or a cancellation too: ocra writes its report,
      # partial or not, before it exits. A review that ran and left no
      # readable report is counted at its cap.
      - id: cost
        if: always() && steps.reserve.outputs.name != ''
        shell: bash
        env:
          REVIEW_OUTCOME: ${{ steps.review.outcome }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          PULL_REQUEST: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          cap=$(awk -v d="$CAP_USD" 'BEGIN { printf "%d", d * 100 + 0.5 }')
          report=$(find .ocra/sessions -name report.json -type f -newer "$RUNNER_TEMP/ocra-review-start" 2>/dev/null | head -n 1 || true)
          if [ -n "$report" ] && cents=$(jq -e '((.usage.costUsd // 0) * 100) | ceil' "$report" 2>/dev/null) &&
            [[ "$cents" =~ ^[0-9]+$ ]]; then
            source="report"
          elif [ -n "$report" ]; then
            cents=$cap
            source="unreadable report, counted at the cap"
          elif [ -z "$REVIEW_OUTCOME" ] || [ "$REVIEW_OUTCOME" = "skipped" ]; then
            cents=0
            source="no review ran"
          else
            cents=$cap
            source="no report, counted at the cap"
          fi
          jq -n --argjson cents "$cents" --arg source "$source" --arg pr "$PULL_REQUEST" --arg head "$HEAD_SHA" \
            '{costUsd: ($cents / 100), source: $source, pullRequest: $pr, head: $head}' > "$RUNNER_TEMP/ocra-cost.json"
          echo "name=ocra-cost-$RUN_ID-$RUN_ATTEMPT-c$cents" >> "$GITHUB_OUTPUT"
          echo "Recorded $(awk -v c="$cents" 'BEGIN { printf "$%.2f", c / 100 }') ($source)." >> "$GITHUB_STEP_SUMMARY"

      - if: always() && steps.cost.outputs.name != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.cost.outputs.name }}
          # Outside the workspace, where nothing in the pull request can
          # stand in for it.
          path: ${{ runner.temp }}/ocra-cost.json
          retention-days: 90
          if-no-files-found: error
