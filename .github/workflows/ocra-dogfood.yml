# Dogfooding: ocra reviews pull requests in the maintainer's repositories on
# Vertex AI, within a hard budget. Each repository calls this file at main
# from its own ocra-review.yml. Google Cloud issues the keyless credential only
# to this file at refs/heads/main (the token's job_workflow_ref), only for
# pull_request events of the maintainer's repositories. A pull request can
# edit its own copy of this file or of the caller, but a copy at its own ref
# gets no credential, and the caller passes nothing that moves the budget: the
# switch and the budget are repository variables, read here.
#
# With model-source "openrouter" a caller reviews on OpenRouter's free model
# instead, through the direct runtime and the caller's OPENROUTER_API_KEY: no
# Google credential, no dollar ledger (the model costs $0), and a task cap in
# place of the budget, since the limit there is the account's 1000 free
# requests a UTC day. The configuration is written here, outside the
# checkout, and passed with --config: nothing in it comes from the pull
# request.
name: ocra dogfood

on:
  workflow_call:
    inputs:
      model-source:
        description: Where the models come from, vertex (default) or openrouter.
        type: string
        default: vertex
    secrets:
      # Secrets rather than variables: the job log of a public repository
      # would show a variable's value, and these name the Vertex project.
      # Required with model-source vertex.
      GCP_WIF_PROVIDER:
        description: Full resource name of the Workload Identity provider.
        required: false
      GCP_SERVICE_ACCOUNT:
        description: Email of the service account that may call Vertex AI models.
        required: false
      GOOGLE_VERTEX_PROJECT:
        description: Google Cloud project that serves Vertex AI.
        required: false
      OPENROUTER_API_KEY:
        description: OpenRouter key, required with model-source openrouter.
        required: false

permissions: {}

jobs:
  # One review at a time per repository, so each one's guard sees every
  # earlier cost: a later run waits, and GitHub keeps only the newest waiting
  # run of the group.
  #
  # The ledger is artifacts named ocra-cost-<run>-<attempt>-<kind><cents>:
  # r, the reservation uploaded before a review may spend anything, and c,
  # what the review spent, uploaded after it. A review with no c entry counts
  # at its reservation, so a job that dies before recording still counts.
  # Listing names needs only actions: read, and a failed listing fails the job
  # before anything is spent.
  review:
    if: >-
      vars.OCRA_REVIEW == 'on' &&
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: ocra-dogfood-${{ github.repository }}
      cancel-in-progress: false
    permissions:
      actions: read
      contents: read
      id-token: write
      pull-requests: write
    env:
      # One review's spend limit (ocra's --max-cost-usd), and the dollars a
      # UTC day may start reviews with.
      CAP_USD: "2"
      DAILY_USD: "2"
      SOURCE: ${{ inputs.model-source }}
      # The free model, in this one place; swap it when the preview ends.
      FREE_MODEL: stealth/space-bunny-alpha
      # Review tasks one review may start on the free model: a task takes 30
      # to 70 requests, so a review stays within a few hundred of the day's
      # 1000. Files past the cap are reported as not reviewed.
      FREE_MAX_TASKS: "8"
      # Requests the day must have left before a review starts.
      FREE_MIN_REQUESTS: "40"
    steps:
      # How many of the day's free requests are left (the action brings its
      # script along: this job has no checkout of this repository). Empty
      # when OpenRouter does not say; then the review runs and a spent quota
      # shows in its report.
      - id: free
        if: inputs.model-source == 'openrouter'
        uses: jma49/Open-CR-Agent/.github/actions/free-quota@main
        with:
          model: ${{ env.FREE_MODEL }}
          api-key: ${{ secrets.OPENROUTER_API_KEY }}
      - id: guard
        uses: jma49/Open-CR-Agent/.github/actions/dogfood@main
        env:
          FREE_LEFT: ${{ steps.free.outputs.left }}
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          SWITCH: ${{ vars.OCRA_REVIEW }}
          BUDGET_USD: ${{ vars.OCRA_REVIEW_BUDGET_USD }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        with:
          step: guard

      # The reservation goes into the ledger before anything can be spent; if
      # it cannot be recorded, the job stops here.
      - id: reserve
        if: steps.guard.outputs.allowed == 'true' && steps.guard.outputs.reserve != ''
        shell: bash
        env:
          RESERVE_CENTS: ${{ steps.guard.outputs.reserve }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          jq -n --argjson cents "$RESERVE_CENTS" '{reservedUsd: ($cents / 100)}' > "$RUNNER_TEMP/ocra-reserve.json"
          echo "name=ocra-cost-$RUN_ID-$RUN_ATTEMPT-r$RESERVE_CENTS" >> "$GITHUB_OUTPUT"

      - if: steps.reserve.outputs.name != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.reserve.outputs.name }}
          path: ${{ runner.temp }}/ocra-reserve.json
          # The ledger must outlive the model credit it tracks.
          retention-days: 90
          if-no-files-found: error

      # Before auth: its credentials file goes into the workspace checkout
      # creates. ocra reviews a pull request from git objects, so agents never
      # see that untracked file, and its name is a secret path besides.
      - if: steps.guard.outputs.allowed == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - if: steps.guard.outputs.allowed == 'true' && env.SOURCE == 'vertex'
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      # Only a report written after this mark is this run's: a pull request
      # can commit files under .ocra/sessions, but not newer ones.
      - if: steps.guard.outputs.allowed == 'true'
        shell: bash
        run: touch "$RUNNER_TEMP/ocra-review-start"

      # Advice only: a failed or incomplete review never fails the pull request.
      - id: review
        if: steps.guard.outputs.allowed == 'true' && env.SOURCE == 'vertex'
        uses: jma49/Open-CR-Agent@d3af4e2189007de77dcf17e736855d04be4a491c # v0.5.0
        continue-on-error: true
        env:
          GOOGLE_VERTEX_PROJECT: ${{ secrets.GOOGLE_VERTEX_PROJECT }}
          GOOGLE_VERTEX_LOCATION: global
          OCRA_MODEL_TOP: google-vertex/gemini-3.1-pro-preview
          OCRA_MODEL_STANDARD: google-vertex/gemini-3.5-flash,google-vertex/gemini-3.5-flash-lite
          OCRA_MODEL_LIGHT: google-vertex/gemini-3.5-flash-lite
        with:
          args: --max-cost-usd ${{ env.CAP_USD }}

      # Written by this file at main, outside the checkout, and passed with
      # --config, which replaces the base commit's .ocra/config.json: the
      # runtime, the endpoint and the key's variable name never come from the
      # pull request. No OCRA_MODEL_* variable is set, since those would win
      # over the file's models.
      - name: Write the free model configuration
        if: steps.guard.outputs.allowed == 'true' && env.SOURCE == 'openrouter'
        shell: bash
        run: |
          set -euo pipefail
          jq -n --arg model "$FREE_MODEL" --argjson maxTasks "$FREE_MAX_TASKS" '{
            runtime: "direct",
            maxTasks: $maxTasks,
            models: { top: ["router/\($model)"], standard: ["router/\($model)"], light: ["router/\($model)"] },
            providers: {
              router: {
                type: "openai-compatible",
                baseUrl: "https://openrouter.ai/api/v1",
                apiKeyEnv: "OPENROUTER_API_KEY",
                models: { ($model): { input: 0, output: 0 } }
              }
            }
          }' > "$RUNNER_TEMP/ocra-free.json"

      # Advice only, as above.
      - id: review-free
        if: steps.guard.outputs.allowed == 'true' && env.SOURCE == 'openrouter'
        uses: jma49/Open-CR-Agent@d3af4e2189007de77dcf17e736855d04be4a491c # v0.5.0
        continue-on-error: true
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        with:
          opencode: false
          args: --config ${{ runner.temp }}/ocra-free.json

      # A day whose free requests ran out fails every task with HTTP 429 and
      # ocra exits 2 (or 3, when some tasks finished first). That is a
      # skipped review, not a broken one: say so instead of leaving a failed
      # step to read. ocra has already posted the review as incomplete.
      - id: free-outcome
        name: Read the free model outcome
        if: always() && steps.review-free.outcome != '' && steps.review-free.outcome != 'skipped'
        uses: jma49/Open-CR-Agent/.github/actions/dogfood@main
        env:
          EXIT_CODE: ${{ steps.review-free.outputs.exit-code }}
          REPORT: ${{ steps.review-free.outputs.report }}
        with:
          step: free-outcome

      # Runs after a failure or a cancellation too: ocra writes its report,
      # partial or not, before it exits. A review that ran and left no
      # readable report is counted at its cap.
      - id: cost
        if: always() && steps.reserve.outputs.name != ''
        uses: jma49/Open-CR-Agent/.github/actions/dogfood@main
        env:
          REVIEW_OUTCOME: ${{ steps.review.outcome }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          PULL_REQUEST: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        with:
          step: cost

      - if: always() && steps.cost.outputs.name != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.cost.outputs.name }}
          # Outside the workspace, where nothing in the pull request can
          # stand in for it.
          path: ${{ runner.temp }}/ocra-cost.json
          retention-days: 90
          if-no-files-found: error
