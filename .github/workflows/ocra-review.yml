# Dogfooding: ocra reviews this repository's pull requests on OpenRouter's
# free model, to collect real reviews within the account's free requests.
# Off unless the repository variable OCRA_REVIEW is "on". The configuration,
# the task cap and the quota check are in ocra-dogfood.yml, called at main as
# every other repository calls it (those stay on Vertex, its default).
name: ocra review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions: {}

# One review per pull request at a time: a new push cancels the older run,
# which still records what it spent.
concurrency:
  group: ocra-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    # Drafts wait for review. A pull request from a fork gets no OIDC token
    # anyway, and Dependabot's version bumps are not worth the credit; the
    # called workflow checks the switch, forks and Dependabot again, since a
    # pull request can edit this file.
    if: >-
      vars.OCRA_REVIEW == 'on' &&
      !github.event.pull_request.draft &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login != 'dependabot[bot]'
    permissions:
      actions: read
      contents: read
      id-token: write
      pull-requests: write
    # At main, not at this pull request's ref, as for every caller. The
    # called job asks for id-token: write for its Vertex path, so the grant
    # stays; without a Google credential step nothing uses it here.
    uses: jma49/Open-CR-Agent/.github/workflows/ocra-dogfood.yml@main
    with:
      model-source: openrouter
    secrets:
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
