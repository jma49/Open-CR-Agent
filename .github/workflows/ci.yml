name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # A newer push supersedes a branch's run; every commit on main keeps its own.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run check
      - run: npm run typecheck
      - run: npm test

  # Installs the packed packages like a user would and runs the installed CLI.
  packages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check:packages

  # The Action's install step both ways, then the installed ocra, with no
  # model call: `npm` installs the published CLI at this commit's version
  # with dependencies pinned by this commit's lockfile (or builds this commit
  # while its version is not on npm); `source` builds this commit, as the
  # Action did before 0.1.1. Cold npm cache, like the Action, on each OS a
  # GitHub-hosted runner offers: the OpenCode binary is per platform.
  action:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        install: [npm, source]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          package-manager-cache: false
      - id: install
        env:
          OCRA_INSTALL: ${{ matrix.install }}
        run: |
          if [ "$OCRA_INSTALL" = source ]; then
            node scripts/action-install.mjs --from-source
          else
            node scripts/action-install.mjs
          fi
      - env:
          OCRA_INSTALL: ${{ matrix.install }}
          OCRA_MAIN: ${{ steps.install.outputs.main }}
        run: |
          # Building is right only while this version is not on npm yet.
          version=$(node -p 'require("./packages/cli/package.json").version')
          if [ "$OCRA_INSTALL" = npm ] && [ "${OCRA_MAIN#"$RUNNER_TEMP"}" = "$OCRA_MAIN" ] &&
            npm view "@open-cr-agent/cli@$version" version >/dev/null 2>&1; then
            echo "::error::@open-cr-agent/cli@$version is on npm, but the Action built it from source"
            exit 1
          fi
          # The install used an npm cache of its own, not ~/.npm.
          test -d "$RUNNER_TEMP/ocra-npm-cache/_cacache"
          node "$OCRA_MAIN" --version
          # The runtime finds the OpenCode binary in the installed layout.
          node --input-type=module -e '
            import { execFileSync } from "node:child_process";
            import { createRequire } from "node:module";
            import { dirname, join } from "node:path";
            const index = createRequire(process.env.OCRA_MAIN).resolve("@open-cr-agent/runtime-opencode");
            const { resolveOpencodeBinary } = await import(join(dirname(index), "binary.js"));
            const binary = resolveOpencodeBinary({});
            console.log(binary, execFileSync(binary, ["--version"], { encoding: "utf8" }).trim());
          '
