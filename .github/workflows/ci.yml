name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # A newer push supersedes a branch's run; every commit on main keeps its own.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run check
      - run: npm run typecheck
      - run: npm test

  # Installs the packed packages like a user would and runs the installed CLI.
  packages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check:packages

  # The Action's install step both ways, then the installed ocra, with no
  # model call: `npm` installs the published CLI at this commit's version
  # with dependencies pinned by this commit's lockfile (or builds this commit
  # while its version is not on npm); `source` builds this commit, as the
  # Action did before 0.1.1. Cold npm cache, like the Action, on each OS a
  # GitHub-hosted runner offers: the OpenCode binary is per platform.
  action:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        install: [npm, source]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          package-manager-cache: false
      - id: install
        env:
          OCRA_INSTALL: ${{ matrix.install }}
        run: |
          if [ "$OCRA_INSTALL" = source ]; then
            node scripts/action-install.mjs --from-source
          else
            node scripts/action-install.mjs
          fi
      - env:
          OCRA_INSTALL: ${{ matrix.install }}
          OCRA_MAIN: ${{ steps.install.outputs.main }}
          OCRA_SOURCE: ${{ steps.install.outputs.source }}
        run: |
          # Building from source is right only while a package at this version
          # is not on npm yet, or when this commit declares other dependencies
          # than the published version; never because an install or a check
          # of what npm serves failed.
          if [ "$OCRA_INSTALL" = npm ] && [ "${OCRA_MAIN#"$RUNNER_TEMP"}" = "$OCRA_MAIN" ]; then
            case "$OCRA_SOURCE" in
              unpublished | dependencies) echo "Built from source: $OCRA_SOURCE" ;;
              *)
                echo "::error::the Action built from source ($OCRA_SOURCE) instead of installing from npm"
                exit 1
                ;;
            esac
          fi
          # The install used an npm cache of its own, not ~/.npm.
          node -e 'require("fs").statSync(require("path").join(process.env.RUNNER_TEMP, "ocra-npm-cache", "_cacache"))'
          node "$OCRA_MAIN" --version
          # The runtime finds the OpenCode binary in the installed layout.
          node --input-type=module -e '
            import { execFileSync } from "node:child_process";
            import { createRequire } from "node:module";
            import { dirname, join } from "node:path";
            import { pathToFileURL } from "node:url";
            const index = createRequire(process.env.OCRA_MAIN).resolve("@open-cr-agent/runtime-opencode");
            // import() takes a URL: a Windows path would read as the scheme "d:".
            const { resolveOpencodeBinary } = await import(pathToFileURL(join(dirname(index), "binary.js")).href);
            const binary = resolveOpencodeBinary({});
            console.log(binary, execFileSync(binary, ["--version"], { encoding: "utf8" }).trim());
          '

  # The container image, built from this commit rather than from npm (its
  # version may not be published yet), then run as a user would.
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: docker build --build-arg OCRA_INSTALL=source --tag ocra:ci .
      - run: |
          docker run --rm ocra:ci ocra --version
          mkdir repo && cd repo
          git init -q -b main
          git -c user.email=ci@example.com -c user.name=CI commit -q --allow-empty -m init
          printf 'export const retries = -1;\n' > app.ts
          # As CI runs it: the checkout mounted and owned by another user.
          plan=$(docker run --rm --user "$(id -u):$(id -g)" --volume "$PWD:/repo" ocra:ci ocra review --plan)
          echo "$plan"
          echo "$plan" | grep -q "Review tasks: 1"

