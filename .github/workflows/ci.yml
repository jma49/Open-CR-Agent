name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # A newer push supersedes a branch's run; every commit on main keeps its own.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # Branch protection requires this job by name: keep it a single job, the
  # Node versions go in node-matrix.
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run check
      - run: npm run typecheck
      # The public API of each package against its report in etc/.
      - run: npm run check:api
      # Unused files, exports and dependencies (knip.jsonc).
      - run: npm run knip
      # Coverage is reported, not gated.
      - run: npm run test:coverage
      - run: node scripts/coverage-summary.mjs >> "$GITHUB_STEP_SUMMARY"

  # The supported range: the engines floor exactly, the Node the release
  # workflow publishes with, and the newest release.
  node-matrix:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22.19.0, 24, latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          node-version: ${{ matrix.node }}
      - run: node --version
      - run: npm run build
      - run: npm test

  # What depends on the operating system, on the others users run ocra on
  # (Linux runs every test above): the ocra Cloud credentials' lock and
  # private files, and the local git adapter (case-folding file systems,
  # paths, child processes).
  platforms:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: npx vitest run packages/cli/src/cloud packages/cli/src/commands/login packages/cli/src/session packages/vcs-local

  # actionlint (with shellcheck, preinstalled on the runner) and zizmor's
  # offline audits of the workflows, action.yml and dependabot.yml, both at
  # pinned versions; zizmor reads .github/zizmor.yml. shellcheck checks the
  # shell scripts of the actions and scripts/ too.
  workflows:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: actionlint
        env:
          VERSION: 1.7.12
          SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          archive="actionlint_${VERSION}_linux_amd64.tar.gz"
          curl -fsSL -o "$RUNNER_TEMP/$archive" \
            "https://github.com/rhysd/actionlint/releases/download/v${VERSION}/${archive}"
          echo "$SHA256  $RUNNER_TEMP/$archive" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -color
          # The workflows ocra init writes (kept by its test).
          "$RUNNER_TEMP/actionlint" -color packages/cli/src/commands/init/__snapshots__/*.yml
      - name: zizmor
        run: pipx run zizmor==1.30.1 --offline --format github .
      - name: shellcheck
        run: shellcheck .github/actions/*/*.sh scripts/*.sh

  # A pull request that changes a published package's source carries a
  # changeset, the entry for CHANGELOG.md (.changeset/README.md). Tests,
  # fixtures and files outside src/ need none (changedFilePatterns in
  # .changeset/config.json); for a source change users do not see,
  # `npx changeset --empty` answers.
  changeset:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          npm-ci-args: --ignore-scripts
      - env:
          BASE_REF: ${{ github.base_ref }}
        run: npx --no-install changeset status --since="origin/$BASE_REF"

  # The pull request's own commits follow Conventional Commits
  # (commitlint.config.mjs); history before this check is not rewritten.
  commits:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          npm-ci-args: --ignore-scripts
      - env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: npx --no-install commitlint --from "$BASE" --to "$HEAD" --verbose
      # No AI author, co-author trailer or tool footer (AGENTS.md). The
      # description is checked when commits are pushed, not on later edits.
      - env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: node scripts/attribution.mjs "$BASE" "$HEAD"

  # Installs the packed packages like a user would and runs the installed CLI.
  packages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: npm run check:packages

  # The Action's install step both ways, then the installed ocra, with no
  # model call: `npm` installs the published CLI at this commit's version
  # with dependencies pinned by this commit's lockfile (or builds this commit
  # while its version is not on npm); `source` builds this commit, as the
  # Action did before 0.1.1. Cold npm cache, like the Action, on each OS a
  # GitHub-hosted runner offers: the OpenCode binary is per platform.
  action:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        install: [npm, source]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          package-manager-cache: false
      - id: install
        env:
          OCRA_INSTALL: ${{ matrix.install }}
        run: |
          if [ "$OCRA_INSTALL" = source ]; then
            node scripts/action-install.mjs --from-source
          else
            node scripts/action-install.mjs
          fi
      - env:
          OCRA_INSTALL: ${{ matrix.install }}
          OCRA_MAIN: ${{ steps.install.outputs.main }}
          OCRA_SOURCE: ${{ steps.install.outputs.source }}
        run: node scripts/check-action-install.mjs
      # The Action's review step (scripts/action-review.sh, as action.yml
      # runs it) against a fake ocra: a review needs a model. On every
      # runner, so Windows paths, the exit-code mapping and the outputs are
      # exercised where the Action runs.
      - name: Fake ocra
        run: |
          cat > "$RUNNER_TEMP/fake-ocra.mjs" <<'EOF'
          import { mkdirSync, writeFileSync } from "node:fs";
          const args = process.argv.slice(2);
          writeFileSync(process.env.FAKE_ARGS, JSON.stringify(args));
          const dir = `.ocra/sessions/${process.env.FAKE_SESSION}`;
          mkdirSync(dir, { recursive: true });
          const report = { version: 1, runId: process.env.FAKE_SESSION, verdict: "minor_issues", findings: [{}] };
          writeFileSync(`${dir}/report.json`, JSON.stringify(report));
          const output = args.indexOf("--output");
          if (output >= 0) writeFileSync(args[output + 1], "{}");
          process.exit(Number(process.env.FAKE_EXIT));
          EOF
      - id: review
        env:
          GITHUB_ACTION_PATH: ${{ github.workspace }}
          OCRA_MAIN: ${{ runner.temp }}/fake-ocra.mjs
          OCRA_PR: "7"
          OCRA_ARGS: --max-cost-usd 2
          OCRA_SARIF: "true"
          FAKE_ARGS: ${{ runner.temp }}/fake-args.json
          FAKE_SESSION: 20991231T235959Z-abcde1
          FAKE_EXIT: "1"
        run: bash "$GITHUB_ACTION_PATH/scripts/action-review.sh"
      - env:
          EXIT_CODE: ${{ steps.review.outputs.exit-code }}
          RUN_ID: ${{ steps.review.outputs.run-id }}
          VERDICT: ${{ steps.review.outputs.verdict }}
          FINDINGS: ${{ steps.review.outputs.findings }}
          REPORT: ${{ steps.review.outputs.report }}
          SARIF: ${{ steps.review.outputs.sarif }}
        run: |
          test "$EXIT_CODE" = 1
          test "$RUN_ID" = 20991231T235959Z-abcde1
          test "$VERDICT" = minor_issues
          test "$FINDINGS" = 1
          grep -q '"verdict":"minor_issues"' "$REPORT"
          test -f "$SARIF"
          grep -q '"--pr","7","--publish","--max-cost-usd","2","--format","sarif"' "$RUNNER_TEMP/fake-args.json"
      # Concerns fail the step when fail-on-concerns is set.
      - env:
          GITHUB_ACTION_PATH: ${{ github.workspace }}
          OCRA_MAIN: ${{ runner.temp }}/fake-ocra.mjs
          OCRA_PR: "7"
          OCRA_FAIL_ON_CONCERNS: "true"
          FAKE_ARGS: ${{ runner.temp }}/fake-args.json
          FAKE_SESSION: 20991231T235959Z-abcde2
          FAKE_EXIT: "1"
        run: |
          code=0
          GITHUB_OUTPUT="$RUNNER_TEMP/concerns-output" bash "$GITHUB_ACTION_PATH/scripts/action-review.sh" || code=$?
          test "$code" = 1
          grep -q '^exit-code=1$' "$RUNNER_TEMP/concerns-output"

  # The container image, built from this commit rather than from npm (its
  # version may not be published yet), then run as a user would.
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: docker build --build-arg OCRA_INSTALL=source --tag ocra:ci .
      - run: |
          docker run --rm ocra:ci --version
          # The command lines of images up to 0.2.0, and GitLab's shell.
          docker run --rm ocra:ci ocra --version
          docker run --rm --entrypoint "" ocra:ci sh -c 'ocra --version'
          mkdir repo && cd repo
          git init -q -b main
          git -c user.email=ci@example.com -c user.name=CI commit -q --allow-empty -m init
          printf 'export const retries = -1;\n' > app.ts
          # As CI runs it: the checkout mounted and owned by another user.
          plan=$(docker run --rm --user "$(id -u):$(id -g)" --volume "$PWD:/repo" ocra:ci review --plan)
          echo "$plan"
          echo "$plan" | grep -q "Review tasks: 1"

