name: Redeploy site

# The project site renders docs/manual at build time, so a manual change
# reaches the live site only after a rebuild through a Vercel deploy hook.
# Vercel's Hobby plan rate-limits builds, so the maintainer triggers it by
# hand (gh workflow run site-deploy.yml) after checking the manual on a local
# build, instead of on every merge.
on:
  workflow_dispatch:

permissions: {}

concurrency:
  group: site-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Trigger Vercel deploy hook
        env:
          HOOK: ${{ secrets.SITE_DEPLOY_HOOK }}
        run: |
          if [ -z "$HOOK" ]; then
            echo "::error::SITE_DEPLOY_HOOK secret is not set"
            exit 1
          fi
          curl --fail --silent --show-error --output /dev/null -X POST "$HOOK"
          echo "Site redeploy requested"
