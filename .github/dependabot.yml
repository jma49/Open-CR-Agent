version: 2
updates:
  # The npm workspaces share the root package-lock.json, so "/" covers packages/*.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # OpenCode is pinned on purpose: a new version can add tools or change the
    # step loop, so it is bumped by hand with a security review (AGENTS.md).
    ignore:
      - dependency-name: opencode-ai
      - dependency-name: "@opencode-ai/sdk"
    groups:
      minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]

  # The container image's base, pinned by digest.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 2

