version: 2
# A release is adopted a week after it is published, when a compromised
# version has usually been found and pulled.
updates:
  # The npm workspaces share the root package-lock.json, so "/" covers packages/*.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    # OpenCode is pinned on purpose: a new version can add tools or change the
    # step loop, so it is bumped by hand with a security review (AGENTS.md).
    ignore:
      - dependency-name: opencode-ai
      - dependency-name: "@opencode-ai/sdk"
      # The types of the oldest Node.js line ocra supports (engines: 22.19),
      # so code cannot use an API that line lacks: a minor (22.20) is a newer
      # Node.js too. Patches only, moved with engines by hand.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
    groups:
      minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]

  # The container image's base, pinned by digest. It stays on the Node.js
  # line CI tests (22); moving to another line is a change of its own.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 2
    ignore:
      - dependency-name: node
        update-types: ["version-update:semver-major"]

