.br{fill:none;stroke:#d4d9e1;stroke-width:2}</style></defs><rect width="1050" height="640" fill="#ffffff"/><rect x="20" y="20" width="86" height="80" rx="8" class="b-code"/><text x="28" y="36" class="m" text-anchor="start">1</text><text x="28" y="55" class="t-code" font-size="13">Ingest</text><text x="28" y="73" class="s" font-size="11">read the</text><text x="28" y="87" class="s" font-size="11">change</text><rect x="112" y="20" width="86" height="80" rx="8" class="b-code"/><text x="120" y="36" class="m" text-anchor="start">2</text><text x="120" y="55" class="t-code" font-size="13">Select</text><text x="120" y="73" class="s" font-size="11">skip binary,</text><text x="120" y="87" class="s" font-size="11">secrets</text><rect x="204" y="20" width="86" height="80" rx="8" class="b-code"/><text x="212" y="36" class="m" text-anchor="start">3</text><text x="212" y="55" class="t-code" font-size="13">Triage</text><text x="212" y="73" class="s" font-size="11">risk tier</text><rect x="296" y="20" width="86" height="80" rx="8" class="b-code"/><text x="304" y="36" class="m" text-anchor="start">4</text><text x="304" y="55" class="t-code" font-size="13">Bundle</text><text x="304" y="73" class="s" font-size="11">group files</text><circle cx="370" cy="32" r="5" class="b-llm"/><rect x="388" y="20" width="86" height="80" rx="8" class="b-code"/><text x="396" y="36" class="m" text-anchor="start">5</text><text x="396" y="55" class="t-code" font-size="13">Matrix</text><text x="396" y="73" class="s" font-size="11">who reviews</text><text x="396" y="87" class="s" font-size="11">what</text><rect x="480" y="20" width="86" height="80" rx="8" class="b-llm"/><text x="488" y="36" class="m" text-anchor="start">6</text><text x="488" y="55" class="t-llm" font-size="13">Execute</text><text x="488" y="73" class="s" font-size="11">reviewer</text><text x="488" y="87" class="s" font-size="11">agents</text><rect x="572" y="20" width="86" height="80" rx="8" class="b-code"/><text x="580" y="36" class="m" text-anchor="start">7</text><text x="580" y="55" class="t-code" font-size="13">Anchor</text><text x="580" y="73" class="s" font-size="11">place by</text><text x="580" y="87" class="s" font-size="11">quoted code</text><circle cx="646" cy="32" r="5" class="b-llm"/><rect x="664" y="20" width="86" height="80" rx="8" class="b-code"/><text x="672" y="36" class="m" text-anchor="start">8</text><text x="672" y="55" class="t-code" font-size="13">Filter</text><text x="672" y="73" class="s" font-size="11">memory ·</text><text x="672" y="87" class="s" font-size="11">re-review</text><rect x="756" y="20" width="86" height="80" rx="8" class="b-llm"/><text x="764" y="36" class="m" text-anchor="start">9</text><text x="764" y="55" class="t-llm" font-size="13">Verify</text><text x="764" y="73" class="s" font-size="11">fact-check</text><rect x="848" y="20" width="86" height="80" rx="8" class="b-llm"/><text x="856" y="36" class="m" text-anchor="start">10</text><text x="856" y="55" class="t-llm" font-size="13">Judge</text><text x="856" y="73" class="s" font-size="11">dedupe ·</text><text x="856" y="87" class="s" font-size="11">severity</text><rect x="940" y="20" width="86" height="80" rx="8" class="b-code"/><text x="948" y="36" class="m" text-anchor="start">11</text><text x="948" y="55" class="t-code" font-size="13">Publish</text><text x="948" y="73" class="s" font-size="11">verdict by</text><text x="948" y="87" class="s" font-size="11">code</text><path d="M20 110 L382 110" class="br"/><text x="201" y="126" class="m" text-anchor="middle">planReview</text><path d="M388 110 L658 110" class="br"/><text x="523" y="126" class="m" text-anchor="middle">executeStage</text><path d="M664 110 L750 110" class="br"/><text x="707" y="126" class="m" text-anchor="middle">filterStage</text><path d="M756 110 L934 110" class="br"/><text x="845" y="126" class="m" text-anchor="middle">checkStage</text><path d="M940 110 L1026 110" class="br"/><text x="983" y="126" class="m" text-anchor="middle">report</text><path d="M480 100 L226 150 M566 100 L626 150" class="a-plain" stroke-dasharray="3 4"/><rect x="20" y="262" width="170" height="76" rx="8" class="b-code"/><text x="32" y="284" class="t-code" font-size="14">Review matrix</text><text x="32" y="303" class="s">one task per</text><text x="32" y="320" class="s">bundle × reviewer</text><rect x="226" y="150" width="400" height="344" rx="12" class="g"/><text x="240" y="172" class="cap" text-anchor="start">ISOLATED AGENT TASKS · READ-ONLY TOOLS · NO SHELL, NO WEB</text><rect x="240" y="186" width="372" height="44" rx="8" class="b-llm"/><text x="252" y="205" class="t-llm" font-size="13">correctness</text><text x="252" y="222" class="s" text-anchor="start">logic, contracts, error handling</text><rect x="530" y="194" width="70" height="18" rx="9" class="chip"/><text x="565" y="207" class="m" text-anchor="middle">standard</text><path d="M190 300 C214 300 214 208 238 208" class="a-code" marker-end="url(#h-code)"/><path d="M612 208 C640 208 640 300 668 300" class="a-llm" marker-end="url(#h-llm)"/><rect x="240" y="238" width="372" height="44" rx="8" class="b-llm"/><text x="252" y="257" class="t-llm" font-size="13">security</text><text x="252" y="274" class="s" text-anchor="start">exploitable issues only</text><rect x="530" y="246" width="70" height="18" rx="9" class="chip"/><text x="565" y="259" class="m" text-anchor="middle">standard</text><path d="M190 300 C214 300 214 260 238 260" class="a-code" marker-end="url(#h-code)"/><path d="M612 260 C640 260 640 300 668 300" class="a-llm" marker-end="url(#h-llm)"/><rect x="240" y="290" width="372" height="44" rx="8" class="b-llm"/><text x="252" y="309" class="t-llm" font-size="13">performance</text><text x="252" y="326" class="s" text-anchor="start">measurable hot-path regressions</text><rect x="530" y="298" width="70" height="18" rx="9" class="chip"/><text x="565" y="311" class="m" text-anchor="middle">standard</text><path d="M190 300 C214 300 214 312 238 312" class="a-code" marker-end="url(#h-code)"/><path d="M612 312 C640 312 640 300 668 300" class="a-llm" marker-end="url(#h-llm)"/><rect x="240" y="342" width="372" height="44" rx="8" class="b-llm"/><text x="252" y="361" class="t-llm" font-size="13">docs</text><text x="252" y="378" class="s" text-anchor="start">public API and docs drift</text><rect x="551" y="350" width="49" height="18" rx="9" class="chip"/><text x="575.5" y="363" class="m" text-anchor="middle">light</text><path d="M190 300 C214 300 214 364 238 364" class="a-code" marker-end="url(#h-code)"/><path d="M612 364 C640 364 640 300 668 300" class="a-llm" marker-end="url(#h-llm)"/><rect x="240" y="394" width="372" height="44" rx="8" class="b-llm"/><text x="252" y="413" class="t-llm" font-size="13">agents-md</text><text x="252" y="430" class="s" text-anchor="start">changes AGENTS.md should note</text><rect x="551" y="402" width="49" height="18" rx="9" class="chip"/><text x="575.5" y="415" class="m" text-anchor="middle">light</text><path d="M190 300 C214 300 214 416 238 416" class="a-code" marker-end="url(#h-code)"/><path d="M612 416 C640 416 640 300 668 300" class="a-llm" marker-end="url(#h-llm)"/><text x="240" y="458" class="m" text-anchor="start">tools: read_file · read_diff · code_search</text><text x="240" y="473" class="m" text-anchor="start">       report_finding · task_done</text><text x="20" y="362" class="l" text-anchor="start">tasks run in parallel,</text><text x="20" y="378" class="l" text-anchor="start">each on its tier's</text><text x="20" y="394" class="l" text-anchor="start">model chain</text><rect x="670" y="262" width="360" height="76" rx="8" class="b-code"/><text x="682" y="284" class="t-code" font-size="14">Anchor</text><text x="682" y="303" class="s">report_finding → quote matched in diff, files</text><text x="682" y="320" class="s">a light model relocates a paraphrase</text><circle cx="1016" cy="276" r="5" class="b-llm"/><path d="M850 338 L850 360" class="a-code" marker-end="url(#h-code)"/><rect x="670" y="362" width="360" height="76" rx="8" class="b-llm"/><text x="682" y="384" class="t-llm" font-size="14">Verifier</text><text x="682" y="403" class="s">standard · one call per file, parallel</text><text x="682" y="420" class="s">drops only what the diff disproves</text><path d="M850 438 L850 460" class="a-llm" marker-end="url(#h-llm)"/><rect x="670" y="462" width="360" height="76" rx="8" class="b-llm"/><text x="682" y="484" class="t-llm" font-size="14">Judge</text><text x="682" y="503" class="s">top · dedupes across reviewers</text><text x="682" y="520" class="s">calibrates severity, writes summary</text><path d="M850 538 L850 560" class="a-llm" marker-end="url(#h-llm)"/><rect x="670" y="562" width="360" height="58" rx="8" class="b-code"/><text x="682" y="584" class="t-code" font-size="14">Verdict</text><text x="682" y="603" class="s">rubric in code over judged findings</text><rect x="20" y="600" width="12" height="12" rx="3" class="b-code"/><text x="38" y="610" class="l" text-anchor="start">Deterministic code</text><rect x="178" y="600" width="12" height="12" rx="3" class="b-llm"/><text x="196" y="610" class="l" text-anchor="start">Model call</text><circle cx="320" cy="606" r="5" class="b-llm"/><text x="332" y="610" class="l" text-anchor="start">code with a light-model fallback</text></svg>
