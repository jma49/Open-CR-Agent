# Written by ocra init. What it does and how to change it:
# https://github.com/jma49/Open-CR-Agent/blob/main/docs/manual/en/github.mdx
name: ocra
on: pull_request

permissions:
  contents: read
  pull-requests: write

# One review per pull request at a time: a new push cancels the older run.
concurrency:
  group: ocra-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: jma49/Open-CR-Agent@82a3f1183a3177e9efa401d87eb95dea495ef619 # v0.6.0
        with:
          args: --max-cost-usd 2
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
